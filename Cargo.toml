[package]
name = "gemma-metal"
version = "0.1.0"
edition = "2021"
description = "Gemma 4 full-custom Metal 4 inference"
publish = false

[features]
default = ["tokenizer"]
# Real HuggingFace tokenizers; disable for CPU-only unit tests without the crate.
tokenizer = ["dep:tokenizers"]

[dependencies]
metal-runtime = { path = "../crates/metal-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.4"
thiserror = "2"
bytemuck = "1"
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
